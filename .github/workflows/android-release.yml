name: Android release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Restore upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/simplebrowser-upload.jks"
          chmod 600 "$RUNNER_TEMP/simplebrowser-upload.jks"

      - name: Build signed Android App Bundle
        env:
          STORE_FILE: ${{ runner.temp }}/simplebrowser-upload.jks
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          ./gradlew clean bundleRelease \
            -PSIMPLEBROWSER_STORE_FILE="$STORE_FILE" \
            -PSIMPLEBROWSER_STORE_PASSWORD="$STORE_PASSWORD" \
            -PSIMPLEBROWSER_KEY_ALIAS="$KEY_ALIAS" \
            -PSIMPLEBROWSER_KEY_PASSWORD="$KEY_PASSWORD"

      - name: Upload release AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: simple-web-browser-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
